
name: Build RoofStudio Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RoofStudio_v0.8 --icon app_icon.ico --add-data "app_icon.png;." --add-data "app_icon.ico;." roofstudio.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RoofStudio_v0.8_Windows_x64
          path: dist/RoofStudio_v0.8.exe
          if-no-files-found: error
